<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qur'on oyatlari</title>
<link rel="preload" href="fonts/ScheherazadeNew-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="core.js"></script>
</head>
<body>
<header>
  <h1>Қуръон оятлари</h1>
  <span id="host-badge" class="badge" hidden>Word</span>
  <button id="settings-btn" class="icon" title="Созламалар" aria-label="Созламалар">⚙</button>
</header>

<main>
  <section class="search">
    <input id="q" type="search" autocomplete="off" dir="auto"
      placeholder="2:255 · Бақара 30-37 · الرحمن الرحيم · ٱلرَّحۡمَـٰنِ · таржима матни">
    <div class="pick">
      <select id="sura" aria-label="Сура"></select>
      <label>оят <input id="from" type="number" min="1" value="1"></label>
      <label>— <input id="to" type="number" min="1" value="1"></label>
    </div>
    <div id="status" class="muted">Юкланмоқда…</div>
    <ol id="results"></ol>
  </section>

  <section class="selection">
    <div class="sel-head">
      <strong id="sel-title"></strong>
      <span class="muted small">Сўзни босинг: 1-марта — бошланиши, 2-марта — охири</span>
      <button id="reset-words" class="link" hidden>Тўлиқ оят</button>
    </div>
    <div id="preview-ar" class="arabic" dir="rtl"></div>
    <div class="actions">
      <button id="insert" class="primary">Қўйиш</button>
      <button id="copy">Нусха олиш</button>
    </div>
    <div class="out">
      <p id="out-ar" class="arabic" dir="rtl"></p>
      <p id="out-uz"></p>
    </div>
  </section>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>Созламалар</h2>
    <label>Таржима (асосий)
      <select id="s-translation"></select></label>
    <label><input type="checkbox" id="s-with-tr"> Таржимани қўшиш</label>
    <label><input type="checkbox" id="s-brackets"> ﴿ ﴾ қавсларни қўшиш</label>
    <label><input type="checkbox" id="s-newpara"> Автоматик янги абзац (Word)</label>
    <fieldset>
      <legend>Араб матни</legend>
      <label>Шрифт <input id="s-ar-font" type="text" list="ar-fonts"></label>
      <datalist id="ar-fonts"><option value="Scheherazade New"><option value="Amiri Quran"></datalist>
      <p class="small muted">Word'да тўғри кўриниши учун шрифтни компьютерга ўрнатинг:
        <a href="fonts/ScheherazadeNew-Regular.ttf" download>Regular</a> ·
        <a href="fonts/ScheherazadeNew-Bold.ttf" download>Bold</a>.
        KFGQPC шрифтлари бу матнни нотўғри кўрсатади.</p>
      <label>Ўлчам <input id="s-ar-size" type="number" min="6" max="72"></label>
    </fieldset>
    <fieldset>
      <legend>Таржима матни</legend>
      <label>Шрифт <input id="s-uz-font" type="text" placeholder="(ҳужжатдагидек)"></label>
      <label>Ўлчам <input id="s-uz-size" type="number" min="6" max="72"></label>
    </fieldset>
    <p class="muted small" id="source"></p>
    <button value="ok" class="primary">Сақлаш</button>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
