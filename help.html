  var RTL = { ar: 1, fa: 1, ur: 1 };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pre(s) { return '<pre>' + esc(s) + '</pre>'; }
  var sel = document.getElementById('lang');
  sel.innerHTML = I18n.languages.map(function (l) { return '<option value="' + l.id + '">' + esc(l.name) + '</option>'; }).join('');

  function show(lang) {
    if (!H[lang]) lang = 'en';
    var x = H[lang], ids = ['about', 'install', 'use', 'faq', 'remove', 'contact'];
    sel.value = lang;
    document.documentElement.lang = lang.split('_')[0];
    document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr';
    document.title = 'Khatt al-Quran — ' + x.title;
    document.getElementById('t-title').textContent = x.title;
    I18n.localize(document.querySelector('p.author'), lang);
    document.getElementById('nav').innerHTML = ids.map(function (id, i) { return '<a href="#' + id + '">' + esc(x.h[i]) + '</a>'; }).join('');
    var html = '';
    html += '<section id="about"><h2>' + esc(x.h[0]) + '</h2><p>' + esc(x.about) + '</p></section>';
    html += '<section id="install"><h2>' + esc(x.h[1]) + '</h2><p>' + esc(x.install) + '</p><p>' + esc(x.mac) + '</p>' + pre(CMD.mac) +
      '<p>' + esc(x.win) + '</p>' + pre(CMD.win) + '<p>' + esc(x.then) + '</p><p><a href="install.html" target="_blank">' + esc(x.more) + '</a></p></section>';
    html += '<section id="use"><h2>' + esc(x.h[2]) + '</h2><ol>' + x.use.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol></section>';
    html += '<section id="faq"><h2>' + esc(x.h[3]) + '</h2>' + x.faq.map(function (f) {
      // commands on their own lines (inline they get mixed up in right-to-left text)
      var a = esc(f[1]).replace('{macCache}', '</p>' + pre(CMD.macCache) + '<p>').replace('{winCache}', '</p>' + pre(CMD.winCache) + '<p>');
      return '<details><summary>' + esc(f[0]) + '</summary><p>' + a + '</p></details>';
    }).join('') + '</section>';
    html += '<section id="remove"><h2>' + esc(x.h[4]) + '</h2><p>' + esc(x.remove) + '</p><p>macOS:</p>' + pre(CMD.macDel) +
      '<p>Windows (PowerShell):</p>' + pre(CMD.winDel) + '</section>';
    var bio = BIO[lang] || BIO.en;
    html += '<section id="contact"><h2>' + esc(x.h[5]) + '</h2>' +
      '<p class="bio"' + (BIO[lang] ? '' : ' dir="ltr" lang="en"') + '>' +
      esc(bio).replace('fatvolar.com', '<a href="https://fatvolar.com" target="_blank" rel="noopener">fatvolar.com</a>') + '</p>' +
      '<p>' + esc(new I18n(lang).t('author')) + ' · <a href="mailto:quran@abdulloh.org">quran@abdulloh.org</a></p></section>';
    document.getElementById('content').innerHTML = html;
  }
  var lang = (location.search.match(/[?&]lang=([\w]+)/) || [])[1];
  if (!lang) try { lang = JSON.parse(localStorage.getItem('myquran-settings') || '{}').uiLang; } catch (e) {}
  if (!lang) lang = (navigator.language || 'en').slice(0, 2);
  sel.addEventListener('change', function () { show(sel.value); history.replaceState(null, '', '?lang=' + sel.value); });
  show(lang);
})();
</script>
