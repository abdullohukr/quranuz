<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khatt al-Quran</title>
<script>
/* The site is the download address for everything (users do not go to GitHub): files too big for the site
   live in the releases of the public repo (one per version, kept), and quran.abdulloh.org/download/ leads to them, so a new
   release appears here by itself. GitHub Pages serves this page for every unknown address. */
(function () {
  var REL = 'https://github.com/abdullohukr/quranuz/releases/download/';
  // /download/<release>/<file>: any version "v3.8.2", "installer" (newest offline programs), "fonts"
  var m = location.pathname.match(/\/download\/(v\d+(?:\.\d+)*|installer|fonts)\/([\w.\-]+)$/);
  if (m) { location.replace(REL + m[1] + '/' + m[2]); return; }
  // /download/<file>: the newest offline programs and the QPC packages
  m = location.pathname.match(/\/download\/([\w.\-]+)$/);
  if (!m) return;
  var f = m[1], tag = /^MyQuran-QPC-V\d-fonts\.zip$/.test(f) ? 'fonts' : /^Khatt-al-Quran-Setup-Offline-/.test(f) ? 'installer' : '';
  if (tag) location.replace(REL + tag + '/' + f);
})();
</script>

  body { font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh;
         background: #f6f7f5; color: #1d2320; text-align: center; padding: 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #15191a; color: #e6ebe8; } a { color: #7fd1b9; } }
  a { color: #2e7d6b; }
</style>
