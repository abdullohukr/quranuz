<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khatt al-Quran — What's new</title>
<link rel="icon" href="assets/icon-32.png">
<script>
  try { var t = (JSON.parse(localStorage.getItem('myquran-settings') || '{}').theme) || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=38">
<style>
  .page { max-width: 760px; margin: 0 auto; padding: 16px; }
  .topbar a.brand { text-decoration: none; color: inherit; }
  .hnav { display: flex; gap: 14px; margin-inline-end: 8px; font-size: 14px; } .hnav a { color: var(--fg); text-decoration: none; } .hnav a:hover { color: var(--accent); }
  .ptitle { margin: 6px 0 0; font-size: 24px; }
  @media (max-width: 520px) { .hnav { display: none; } }
  .intro { color: var(--muted); margin: 10px 0 4px; }
  .rel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .rel h2 { margin: 0; font-size: 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rel .ver { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
  .rel .date { color: var(--muted); font-size: 13px; font-weight: 400; margin-inline-start: auto; }
  .rel ul { margin: 10px 0 0; padding-inline-start: 20px; } .rel li { margin: 5px 0; }
  .rel.latest { border-color: var(--accent); }
  .rel .dl { margin: 10px 0 0; line-height: 1.9; } .rel .dl a { white-space: nowrap; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img class="logo" src="assets/icon-64.png" width="30" height="30" alt=""><h1>Khatt al-Quran</h1></a>
  <nav class="hnav"><a href="install.html" id="t-install">Install</a><a href="help.html" data-i18n="help">Help</a></nav>
  <select id="lang" aria-label="Language"><option value="uz">Ўзбекча</option><option value="ru">Русский</option><option value="en">English</option><option value="ar">العربية</option></select>
</header>
<div class="page">
  <h1 class="ptitle" id="t-title"></h1>
  <p class="intro" id="t-intro"></p>
  <div id="list"></div>
  <p class="author"><span data-i18n="author">Abdulloh Hamidulloh al-Madiyniy</span> · <a href="mailto:quran@abdulloh.org">quran@abdulloh.org</a> · <a href="help.html" data-i18n="help">Help</a> · <a href="privacy.html" data-i18n="privacy">Privacy</a> · <a href="terms.html" data-i18n="terms">Terms</a></p>
</div>
<script src="i18n.js?v=38"></script>
<script src="releases.js?v=38"></script>
<script>
(function () {
  'use strict';
  var T = {
    uz: { title: 'Дастур нашрлари тарихи', intro: 'Дастурнинг биринчи кунидан бугунги кунгача бўлган барча нашрлари ва улардаги ўзгаришлар рўйхати.', latest: 'Энг охиргиси', dl: 'Юклаб олиш', online: 'онлайн', offline: 'офлайн', install: 'Ўрнатиш', mb: 'МБ', noFiles: '' },
    ru: { title: 'Что нового', intro: 'Все версии программы с первого дня до сегодняшнего и что в них изменилось.', latest: 'Последняя', dl: 'Скачать', online: 'онлайн', offline: 'без интернета', install: 'Установка', mb: 'МБ', noFiles: '' },
    en: { title: "What's new", intro: 'Every version of the app from the first day to today, and what changed in each.', latest: 'Latest', dl: 'Download', online: 'online', offline: 'offline', install: 'Install', mb: 'MB', noFiles: '' },
    ar: { title: 'ما الجديد', intro: 'جميع إصدارات البرنامج منذ اليوم الأول حتى اليوم، وما الذي تغيّر في كل منها.', latest: 'الأحدث', dl: 'تنزيل', online: 'عبر الإنترنت', offline: 'دون إنترنت', install: 'التثبيت', mb: 'MB', noFiles: '' }
  };
  var R = window.KhattReleases || [];
  var MONTHS = { uz: ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    ru: ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
    en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'] };
  function date(d, l) {
    var p = d.split('-');
    if (l === 'uz') return +p[2] + '-' + MONTHS.uz[+p[1] - 1] + ' ' + p[0] + '-йил';   // 10-октябрь 2026-йил
    return +p[2] + ' ' + MONTHS[l][+p[1] - 1] + ' ' + p[0];
  }
  var sel = document.getElementById('lang');
  function show(l) {
    if (!T[l]) l = 'en';
    sel.value = l; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.title = T[l].title + ' — Khatt al-Quran';
    document.getElementById('t-install').textContent = T[l].install;
    if (window.I18n) I18n.localize(document.querySelector('.hnav'), l);
    document.getElementById('t-title').textContent = T[l].title;
    if (window.I18n) I18n.localize(document.querySelector('p.author'), l);
    document.getElementById('t-intro').textContent = T[l].intro;
    document.getElementById('list').innerHTML = R.map(function (r, i) {
      return '<section class="rel' + (i ? '' : ' latest') + '"><h2><span class="ver">' + r[0] + '</span>' + r[2][l] +
        (i ? '' : ' <span class="muted small">· ' + T[l].latest + '</span>') + '<span class="date">' + date(r[1], l) + '</span></h2>' +
        '<ul>' + r[3][l].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' + files(r[0], l) + '</section>';
    }).join('');
  }
  /* Downloads of each version: the GitHub release "v<version>" of the public repo (kept for every version from
     3.8.2 on), listed live, downloaded through the site (quran.abdulloh.org/download/<tag>/<file>, see 404.html) */
  var GH = {};
  function label(f, l) {
    var os = /-Mac\./.test(f) ? 'Mac' : /-Windows\./.test(f) ? 'Windows' : '';
    return os ? os + ' · ' + (/-Offline-/.test(f) ? T[l].offline : T[l].online) : f;
  }
  function key(f) { return (/-Mac\./.test(f) ? 0 : /-Windows\./.test(f) ? 1 : 2) + (/-Offline-/.test(f) ? 'b' : 'a') + f; }   // Mac, Windows; online first
  function files(v, l) {
    var a = GH['v' + v];
    if (!a || !a.length) return '';
    return '<p class="dl"><b>' + T[l].dl + ':</b> ' + a.map(function (x) {
      return '<a href="download/v' + v + '/' + encodeURIComponent(x.name) + '">' + label(x.name, l) + '</a> <span class="muted small">' +
        Math.max(1, Math.round(x.size / 1048576)) + ' ' + T[l].mb + '</span>';
    }).join(' · ') + '</p>';
  }
  if (window.fetch) fetch('https://api.github.com/repos/abdullohukr/quranuz/releases?per_page=100').then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
    list.forEach(function (rel) {
      GH[rel.tag_name] = (rel.assets || []).filter(function (x) { return /^[\w.\-]+$/.test(x.name); })
        .sort(function (a, b) { return key(a.name) < key(b.name) ? -1 : 1; });
    });
    show(sel.value);
  }).catch(function () {});
  var lang = ((location.search.match(/[?&]lang=(\w+)/) || [])[1] || '').split('_')[0];
  if (!lang) try { lang = (JSON.parse(localStorage.getItem('myquran-settings') || '{}').uiLang || '').split('_')[0]; } catch (e) {}
  if (!lang) lang = (navigator.language || 'en').slice(0, 2);
  sel.addEventListener('change', function () { show(sel.value); history.replaceState(null, '', '?lang=' + sel.value); });
  show(lang);
})();
</script>
</body>
</html>
